name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  build:
    name: Firmware build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: release
            flags: ""
          - variant: debug-pattern
            flags: "-DDEBUG_PATTERN"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-avr-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e nano
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'release'
        with:
          name: firmware
          path: .pio/build/nano/firmware.hex
