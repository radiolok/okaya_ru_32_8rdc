[platformio]
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_protocol = arduino
build_flags =

; Host-side unit tests: `pio test -e native`
; Hardware-facing files (main, display, hal_*) are replaced by fakes in test/test_host.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<terminal.cpp> +<esc_parser.cpp> +<demo.cpp>
build_flags = -I test/mocks -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all
build_unflags =
extra_scripts = pre:test/link_sanitizers.py
